*{box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}body{margin:0;background:#f1f2f6;padding-bottom:70px}
.app-top{background:#0b2a5b;color:#fff;padding:14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.logo{width:46px;height:46px;background:#ffc107;color:#0b2a5b;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900}
